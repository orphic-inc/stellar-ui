name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: API contract freshness
        if: ${{ !cancelled() }}
        # Regenerate api.ts from the vendored, pinned openapi.json; a stale
        # committed copy reds the build (mirrors stellar-api's OpenAPI/ERD gates,
        # ADR-0018). Re-sync deliberately with `npm run api:sync`.
        run: npm run api:generate && git diff --exit-code src/types/api.ts
      - name: Service-layer type sources
        if: ${{ !cancelled() }}
        # RTK Query result types must come from the generated client, not from a
        # hand-written interface — otherwise the repo carries a second, unchecked
        # description of the API (#277, the same failure as #271 one layer out).
        # Grandfathered endpoints live in service-types-baseline.json; a NEW
        # hand-typed result fails here, and so does a baseline entry that has
        # gone stale, so the list can only shrink.
        run: npm run service-types:check
      - name: Version consistency
        if: ${{ !cancelled() }}
        # Internal version surfaces (lockfile, CHANGELOG) must match the manifest
        # — mirrors stellar-api's version:check (ADR-0018). The footer's displayed
        # version is derived at runtime from the platform (#105), so it isn't
        # gated here; this guards the remaining committed surfaces.
        run: npm run version:check
      - name: Format check
        if: ${{ !cancelled() }}
        run: npx prettier --check src
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Type check
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test
      # Playwright E2E requires both stellar-api and stellar-ui running with
      # seeded test users. Setup is tracked separately; add here once ready.

  # The production build is the gate this repo was missing: `publish` only runs
  # on main and tags, so every webpack/loader/babel/base-image bump reached main
  # having never once been built. Mirrors stellar-api's `smoke` job.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the production image
        run: docker build -t stellar-ui:ci .
      - name: Boot it and prove nginx serves the bundle
        run: |
          set -euo pipefail
          docker run -d --name ui -p 8081:80 stellar-ui:ci
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8081/ > /dev/null; then
              echo "index served"; exit 0
            fi
            sleep 2
          done
          echo "::error::nginx never served the bundle"; docker logs ui; exit 1

  dev-smoke:
    # `npm start` is covered by no other gate: `build` is production, where
    # devServer and ESLintPlugin are both dev-only branches, and the image serves
    # the built bundle through nginx. A webpack-dev-server 5 breaking change
    # therefore shipped in 0.8.3 with every check green — the dev server refused
    # to start at all, and only a developer running it locally would find out.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Boot the dev server and prove it serves
        run: |
          set -uo pipefail
          # --no-open overrides `open: true`, which would try to launch a browser
          # on a headless runner.
          npm start -- --no-open > dev-server.log 2>&1 &
          DEV_PID=$!
          served=0
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:9000/ > /dev/null 2>&1; then served=1; break; fi
            kill -0 "$DEV_PID" 2>/dev/null || break   # webpack exited; stop waiting
            sleep 2
          done
          kill "$DEV_PID" 2>/dev/null || true
          pkill -f "webpack serve" 2>/dev/null || true
          # -a: the log carries ANSI colour codes, which make grep treat it as
          # binary and suppress the context needed to diagnose a failure.
          if grep -aqE "Invalid options object|ERROR in" dev-server.log; then
            echo "::error::the dev server reported errors on boot"
            grep -anE "Invalid options object|ERROR in" -A6 dev-server.log | head -30
            exit 1
          fi
          if [ "$served" -ne 1 ]; then
            echo "::error::the dev server never served http://localhost:9000/"
            tail -40 dev-server.log
            exit 1
          fi
          echo "dev server booted and served the app"

  publish:
    needs: [test, build]
    # This workflow's history lives in both the obrien-k fork and the canonical
    # orphic-inc repo (same file, same commits). Gate on repository rather than
    # deleting the job, so it fires in the canonical context and no-ops on the
    # fork's own CI runs — restores the publish path stripped by 51d7314, which
    # dropped it entirely to avoid the fork publishing under its own namespace.
    if: github.repository == 'orphic-inc/stellar-ui' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [publish]
    # `publish` already carries the fork gate, and a skipped dependency skips its
    # dependents — but the repository check is repeated here so this job's own
    # condition is readable without tracing `needs`, and so the fork can never
    # publish Releases under its own namespace. Ported from stellar-api, which
    # has run this since v0.7.0.
    if: >-
      github.repository == 'orphic-inc/stellar-ui' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the Release from its CHANGELOG section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Headings are `## [x.y.z] — date`, but older ones use a hyphen instead
          # of an em dash, so match the bracketed version and nothing after it.
          # Dots are escaped or `0.8.1` would also match `0x8y1`.
          notes="$(awk -v ver="$version" '
            BEGIN { gsub(/\./, "\\.", ver) }
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          # Fail loudly rather than publishing an empty Release: a missing section
          # means the CHANGELOG was not updated for this tag, which is worth
          # knowing at release time.
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::No CHANGELOG.md section found for $version"
            exit 1
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"

# How the stellar-ui bundle is served. This file is a contract (ADR-0011):
# stellar-compose's proxy `include`s it in each of its server blocks, and this
# image's own default.conf includes it for standalone use. Keep it true for
# both:
#
# - It is included in SERVER context. No `listen`, no `server_name`: the
#   including server owns those.
# - It holds the only `location /`. An including server must not define one;
#   it adds its own locations (compose's `/api/`) beside it.
# - No `add_header`, here or in a location. nginx drops every inherited
#   `add_header` in a block that declares its own, so one here would silently
#   remove compose's TLS Strict-Transport-Security header from the bundle.
# - `mime.types` is in scope: the image's stock nginx.conf includes it, and
#   neither this image nor compose replaces that file. Without it every file is
#   text/plain, and browsers refuse the stylesheet (stellar-compose#61).

root /usr/share/nginx/html;

gzip on;
# PNGs are already compressed; gzip only costs CPU there.
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_comp_level 9;
etag on;

location / {
  try_files $uri $uri/index.html $uri/ /index.html;
}
